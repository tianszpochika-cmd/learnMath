name: learnmath

services:
  mysql:
    image: mysql:8.0
    container_name: learnmath-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: learnmath_root_2026
      MYSQL_DATABASE: learnmath
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      - ./server/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:8-alpine
    container_name: learnmath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    command: redis-server --appendonly yes

volumes: {}
